<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#0f2d1a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="runner-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="600" height="300" fill="url(#nightsky)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="45" cy="20" r="1.2" opacity="0.9"/>
    <circle cx="120" cy="35" r="0.8" opacity="0.7"/>
    <circle cx="200" cy="15" r="1.4" opacity="0.8"/>
    <circle cx="280" cy="40" r="0.9" opacity="0.6"/>
    <circle cx="360" cy="22" r="1.1" opacity="0.9"/>
    <circle cx="440" cy="38" r="0.8" opacity="0.7"/>
    <circle cx="520" cy="18" r="1.3" opacity="0.8"/>
    <circle cx="575" cy="45" r="1" opacity="0.6"/>
    <circle cx="80" cy="60" r="0.7" opacity="0.5"/>
    <circle cx="170" cy="55" r="1" opacity="0.7"/>
    <circle cx="310" cy="65" r="0.8" opacity="0.6"/>
    <circle cx="490" cy="58" r="1.1" opacity="0.8"/>
    <circle cx="560" cy="72" r="0.9" opacity="0.5"/>
    <circle cx="25" cy="80" r="0.8" opacity="0.6"/>
    <circle cx="400" cy="12" r="0.7" opacity="0.8"/>
    <!-- Bright stars -->
    <circle cx="150" cy="28" r="1.8" opacity="0.95"/>
    <circle cx="470" cy="25" r="1.6" opacity="0.9"/>
    <circle cx="330" cy="18" r="1.5" opacity="0.85"/>
  </g>

  <!-- Moon -->
  <circle cx="500" cy="55" r="28" fill="#fef9c3" opacity="0.15"/>
  <circle cx="500" cy="55" r="22" fill="#fef9c3" opacity="0.9"/>
  <!-- Moon crescent shadow -->
  <circle cx="509" cy="50" r="18" fill="#0c1a2e"/>
  <!-- Moon glow -->
  <circle cx="500" cy="55" r="35" fill="url(#moon-glow)"/>

  <!-- Distant city skyline (back) -->
  <g fill="#0a1628" opacity="0.7">
    <rect x="0" y="160" width="30" height="100"/>
    <rect x="20" y="140" width="25" height="120"/>
    <rect x="40" y="150" width="20" height="110"/>
    <rect x="55" y="130" width="35" height="130"/>
    <!-- Antenna -->
    <rect x="68" y="110" width="3" height="25"/>
    <rect x="75" y="120" width="20" height="110"/>
    <rect x="90" y="145" width="25" height="115"/>
    <rect x="110" y="135" width="30" height="125"/>
    <rect x="135" y="115" width="22" height="145"/>
    <rect x="152" y="140" width="18" height="120"/>
    <rect x="165" y="125" width="28" height="135"/>
    <rect x="488" y="160" width="25" height="100"/>
    <rect x="505" y="140" width="30" height="120"/>
    <rect x="530" y="150" width="22" height="110"/>
    <rect x="545" y="125" width="28" height="135"/>
    <rect x="565" y="145" width="20" height="115"/>
    <rect x="578" y="130" width="25" height="130"/>
  </g>

  <!-- City skyline (mid) -->
  <g fill="#0d1f35">
    <rect x="0" y="185" width="40" height="115"/>
    <rect x="35" y="165" width="30" height="135"/>
    <rect x="60" y="175" width="22" height="125"/>
    <rect x="78" y="155" width="35" height="145"/>
    <rect x="110" y="170" width="25" height="130"/>
    <rect x="130" y="148" width="28" height="152"/>
    <rect x="155" y="162" width="32" height="138"/>
    <rect x="183" y="178" width="20" height="122"/>
    <rect x="198" y="168" width="26" height="132"/>
    <!-- Windows -->
    <rect x="220" y="185" width="18" height="115"/>
    <rect x="233" y="172" width="22" height="128"/>
    <!-- Tall building center-left -->
    <rect x="250" y="140" width="35" height="160"/>
    <rect x="280" y="158" width="28" height="142"/>
    <!-- Right buildings -->
    <rect x="385" y="180" width="25" height="120"/>
    <rect x="405" y="162" width="30" height="138"/>
    <rect x="430" y="155" width="22" height="145"/>
    <rect x="447" y="170" width="28" height="130"/>
    <rect x="470" y="178" width="20" height="122"/>
    <rect x="485" y="148" width="35" height="152"/>
    <rect x="515" y="165" width="25" height="135"/>
    <rect x="535" y="175" width="30" height="125"/>
    <rect x="560" y="158" width="22" height="142"/>
    <rect x="578" y="168" width="22" height="132"/>
  </g>

  <!-- Building windows (lit) -->
  <g fill="#fde68a" opacity="0.6">
    <rect x="62" y="180" r="1" width="4" height="3"/>
    <rect x="70" y="180" r="1" width="4" height="3"/>
    <rect x="62" y="190" r="1" width="4" height="3"/>
    <rect x="83" y="162" r="1" width="4" height="3"/>
    <rect x="92" y="162" r="1" width="4" height="3"/>
    <rect x="83" y="172" r="1" width="4" height="3"/>
    <rect x="136" y="155" r="1" width="4" height="3"/>
    <rect x="136" y="168" r="1" width="4" height="3"/>
    <rect x="144" y="155" r="1" width="4" height="3"/>
    <rect x="158" y="168" r="1" width="4" height="3"/>
    <rect x="167" y="168" r="1" width="4" height="3"/>
    <rect x="255" y="148" r="1" width="4" height="3"/>
    <rect x="264" y="148" r="1" width="4" height="3"/>
    <rect x="255" y="160" r="1" width="4" height="3"/>
    <rect x="407" y="168" r="1" width="4" height="3"/>
    <rect x="416" y="168" r="1" width="4" height="3"/>
    <rect x="407" y="180" r="1" width="4" height="3"/>
    <rect x="490" y="155" r="1" width="4" height="3"/>
    <rect x="499" y="155" r="1" width="4" height="3"/>
    <rect x="537" y="180" r="1" width="4" height="3"/>
    <rect x="546" y="180" r="1" width="4" height="3"/>
  </g>
  <!-- Blue/white windows -->
  <g fill="#93c5fd" opacity="0.5">
    <rect x="38" y="170" r="1" width="4" height="3"/>
    <rect x="113" y="175" r="1" width="4" height="3"/>
    <rect x="162" y="172" r="1" width="4" height="3"/>
    <rect x="285" y="165" r="1" width="4" height="3"/>
    <rect x="432" y="162" r="1" width="4" height="3"/>
    <rect x="518" y="172" r="1" width="4" height="3"/>
    <rect x="564" y="165" r="1" width="4" height="3"/>
  </g>

  <!-- Ground / running track -->
  <rect x="0" y="255" width="600" height="45" fill="url(#ground)"/>
  <!-- Track lane lines -->
  <line x1="0" y1="258" x2="600" y2="258" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="268" x2="600" y2="268" stroke="#22c55e" stroke-width="0.5" opacity="0.3" stroke-dasharray="20,15"/>

  <!-- Runner glow trail -->
  <ellipse cx="310" cy="260" rx="80" ry="8" fill="#34d399" opacity="0.15"/>

  <!-- Runner silhouette (mid-stride, right) -->
  <g fill="#052e16" transform="translate(290,195)">
    <!-- Head -->
    <circle cx="28" cy="10" r="10" fill="#022c22"/>
    <!-- Torso (leaning forward) -->
    <rect x="21" y="20" width="16" height="28" rx="3" fill="#022c22" transform="rotate(-8,29,34)"/>
    <!-- Left arm (forward) -->
    <line x1="22" y1="28" x2="5" y2="15" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
    <!-- Right arm (back) -->
    <line x1="35" y1="28" x2="52" y2="40" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
    <!-- Left leg (forward, bent) -->
    <line x1="25" y1="48" x2="10" y2="62" stroke="#022c22" stroke-width="7" stroke-linecap="round"/>
    <line x1="10" y1="62" x2="0" y2="58" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
    <!-- Right leg (back, extended) -->
    <line x1="33" y1="48" x2="50" y2="65" stroke="#022c22" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="65" x2="62" y2="62" stroke="#022c22" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Speed lines behind runner -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="200" y1="230" x2="270" y2="230"/>
    <line x1="195" y1="240" x2="265" y2="240"/>
    <line x1="205" y1="250" x2="275" y2="250"/>
    <line x1="210" y1="222" x2="268" y2="222"/>
  </g>
  <g stroke="#34d399" stroke-width="1" opacity="0.25" stroke-linecap="round">
    <line x1="175" y1="235" x2="250" y2="235"/>
    <line x1="180" y1="245" x2="255" y2="245"/>
  </g>

  <!-- Distance marker -->
  <rect x="480" y="240" width="80" height="22" rx="4" fill="#14532d" opacity="0.8"/>
  <text x="520" y="255" text-anchor="middle" font-size="11" fill="#4ade80" font-family="monospace" font-weight="bold">5K RUN</text>

  <!-- Finish line elements (far right) -->
  <g opacity="0.5">
    <rect x="570" y="220" width="4" height="80" fill="#f9fafb"/>
    <rect x="574" y="220" width="26" height="6" fill="#f9fafb"/>
    <rect x="574" y="232" width="26" height="6" fill="#1f2937"/>
    <rect x="574" y="244" width="26" height="6" fill="#f9fafb"/>
    <rect x="574" y="256" width="26" height="6" fill="#1f2937"/>
    <rect x="574" y="268" width="26" height="6" fill="#f9fafb"/>
    <rect x="574" y="280" width="26" height="6" fill="#1f2937"/>
    <rect x="574" y="292" width="26" height="8" fill="#f9fafb"/>
  </g>
</svg>
