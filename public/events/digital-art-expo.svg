    <polygon points="-3,-40 3,-40 1.5,-55 -1.5,-55" fill="#fbbf24" opacity="0.9"/>
    <ellipse cx="0" cy="16" rx="4" ry="6" fill="#7c3aed" opacity="0.9"/>
