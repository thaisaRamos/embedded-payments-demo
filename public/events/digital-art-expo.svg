    <rect x="266" y="154" width="14" height="14" fill="#f59e0b"/>
    <rect x="282" y="154" width="14" height="14" fill="#ec4899"/>
    <rect x="298" y="154" width="14" height="14" fill="#a855f7"/>
    <rect x="314" y="154" width="14" height="14" fill="#06b6d4"/>
    <rect x="330" y="154" width="14" height="14" fill="#34d399"/>
    <rect x="346" y="154" width="14" height="14" fill="#f59e0b"/>

    <rect x="234" y="170" width="14" height="14" fill="#f59e0b"/>
    <rect x="250" y="170" width="14" height="14" fill="#06b6d4"/>
    <rect x="266" y="170" width="14" height="14" fill="#818cf8"/>
    <rect x="282" y="170" width="14" height="14" fill="#34d399"/>
    <rect x="298" y="170" width="14" height="14" fill="#06b6d4"/>
    <rect x="314" y="170" width="14" height="14" fill="#f59e0b"/>
    <rect x="330" y="170" width="14" height="14" fill="#ec4899"/>
    <rect x="346" y="170" width="14" height="14" fill="#a855f7"/>

