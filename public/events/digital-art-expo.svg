  <polygon points="500,128 512,145 500,162 488,145" fill="#ec4899" opacity="0.12"/>

  <polygon points="75,155 88,178 75,201 62,178" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>

