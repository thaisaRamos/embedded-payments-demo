  <!-- Scattered sparkles -->
  <g fill="#e9d5ff" opacity="0.8">
    <polygon points="555,60 558,70 568,70 560,76 563,86 555,80 547,86 550,76 542,70 552,70" transform="scale(0.6) translate(370,50)"/>
    <polygon points="100,40 102,47 109,47 103,51 105,58 100,54 95,58 97,51 91,47 98,47" transform="scale(0.5) translate(100,30)"/>
