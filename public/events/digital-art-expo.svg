<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0533"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow1)"/>
  <rect width="600" height="300" fill="url(#glow2)"/>
  <rect width="600" height="300" fill="url(#glow3)"/>

  <!-- Abstract geometric shapes — back layer -->
  <!-- Large transparent triangle -->
  <polygon points="50,280 200,40 350,280" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <polygon points="250,270 420,30 580,270" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.25"/>

  <!-- Rotating squares -->
  <rect x="80" y="60" width="90" height="90" rx="4" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4" transform="rotate(15,125,105)"/>
  <rect x="92" y="72" width="66" height="66" rx="3" fill="#a855f7" opacity="0.08" transform="rotate(15,125,105)"/>

  <rect x="420" y="100" width="110" height="110" rx="4" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.35" transform="rotate(-20,475,155)"/>
  <rect x="434" y="114" width="82" height="82" rx="3" fill="#ec4899" opacity="0.07" transform="rotate(-20,475,155)"/>

  <!-- Floating orbs -->
  <circle cx="145" cy="125" r="50" fill="#7c3aed" opacity="0.18"/>
  <circle cx="145" cy="125" r="35" fill="#a855f7" opacity="0.22"/>
  <circle cx="145" cy="125" r="20" fill="#c084fc" opacity="0.35"/>
  <circle cx="145" cy="125" r="8" fill="#e9d5ff" opacity="0.8"/>

  <circle cx="440" cy="170" r="60" fill="#be185d" opacity="0.15"/>
  <circle cx="440" cy="170" r="42" fill="#ec4899" opacity="0.2"/>
  <circle cx="440" cy="170" r="24" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="440" cy="170" r="9" fill="#fce7f3" opacity="0.85"/>

  <circle cx="310" cy="70" r="35" fill="#0e7490" opacity="0.2"/>
  <circle cx="310" cy="70" r="22" fill="#06b6d4" opacity="0.3"/>
  <circle cx="310" cy="70" r="10" fill="#cffafe" opacity="0.7"/>

  <!-- Connecting lines between orbs -->
  <line x1="145" y1="125" x2="310" y2="70" stroke="#c084fc" stroke-width="0.8" opacity="0.25"/>
  <line x1="310" y1="70" x2="440" y2="170" stroke="#67e8f9" stroke-width="0.8" opacity="0.25"/>
  <line x1="145" y1="125" x2="440" y2="170" stroke="#f9a8d4" stroke-width="0.8" opacity="0.2"/>

  <!-- Scattered small shapes -->
