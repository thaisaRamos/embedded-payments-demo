<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#7c1f6e"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="78%" r="30%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0a2e"/>
      <stop offset="100%" stop-color="#0f0618"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="300" fill="url(#sky)"/>

  <!-- Sun glow -->
  <rect width="600" height="300" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="160" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="240" cy="55" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="350" cy="30" r="1" fill="white" opacity="0.7"/>
  <circle cx="450" cy="50" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="520" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="570" cy="60" r="1.4" fill="white" opacity="0.7"/>
  <circle cx="420" cy="15" r="1" fill="white" opacity="0.9"/>
  <circle cx="110" cy="70" r="1.1" fill="white" opacity="0.5"/>

  <!-- Sun -->
  <circle cx="300" cy="230" r="55" fill="url(#sun)" opacity="0.95"/>
  <circle cx="300" cy="230" r="45" fill="#fde68a" opacity="0.6"/>

  <!-- Horizon glow line -->
  <ellipse cx="300" cy="210" rx="220" ry="12" fill="#f97316" opacity="0.5"/>

  <!-- Stage platform -->
  <rect x="120" y="210" width="360" height="90" fill="url(#stage)"/>

  <!-- Stage roof truss -->
  <rect x="115" y="165" width="370" height="8" fill="#2d1b4e" rx="2"/>
  <rect x="140" y="130" width="8" height="85" fill="#2d1b4e"/>
  <rect x="452" y="130" width="8" height="85" fill="#2d1b4e"/>
  <!-- Truss cross beams -->
  <line x1="148" y1="135" x2="460" y2="168" stroke="#2d1b4e" stroke-width="3"/>
  <line x1="148" y1="168" x2="460" y2="135" stroke="#2d1b4e" stroke-width="3"/>

  <!-- Stage lights beams -->
  <polygon points="185,165 160,230 210,230" fill="#fde68a" opacity="0.12"/>
  <polygon points="240,165 210,230 270,230" fill="#e879f9" opacity="0.12"/>
  <polygon points="300,165 265,230 335,230" fill="#60a5fa" opacity="0.15"/>
  <polygon points="360,165 330,230 390,230" fill="#34d399" opacity="0.12"/>
  <polygon points="415,165 390,230 440,230" fill="#fb923c" opacity="0.12"/>

  <!-- Stage light circles -->
  <circle cx="185" cy="162" r="8" fill="#fde68a" opacity="0.9"/>
  <circle cx="240" cy="162" r="8" fill="#e879f9" opacity="0.9"/>
  <circle cx="300" cy="162" r="9" fill="#60a5fa" opacity="0.9"/>
  <circle cx="360" cy="162" r="8" fill="#34d399" opacity="0.9"/>
  <circle cx="415" cy="162" r="8" fill="#fb923c" opacity="0.9"/>

  <!-- Performer silhouette (guitarist) -->
  <circle cx="270" cy="200" r="10" fill="#0f0618"/>
  <rect x="265" y="210" width="10" height="20" fill="#0f0618"/>
  <line x1="260" y1="218" x2="255" y2="230" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <line x1="275" y1="218" x2="285" y2="228" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <!-- Guitar body -->
  <ellipse cx="283" cy="226" rx="8" ry="6" fill="#0f0618"/>
  <line x1="283" y1="220" x2="290" y2="208" stroke="#0f0618" stroke-width="3" stroke-linecap="round"/>

  <!-- Performer silhouette (singer with mic) -->
  <circle cx="310" cy="196" r="11" fill="#0f0618"/>
  <rect x="305" y="207" width="10" height="22" fill="#0f0618"/>
  <line x1="305" y1="215" x2="295" y2="225" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <!-- Mic arm -->
  <line x1="315" y1="213" x2="325" y2="203" stroke="#0f0618" stroke-width="3" stroke-linecap="round"/>
  <circle cx="328" cy="201" r="4" fill="#0f0618"/>

  <!-- Performer silhouette (drummer raised arm) -->
  <circle cx="348" cy="200" r="10" fill="#0f0618"/>
  <rect x="343" y="210" width="10" height="18" fill="#0f0618"/>
  <line x1="343" y1="218" x2="336" y2="226" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <line x1="353" y1="215" x2="360" y2="205" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>

  <!-- Crowd silhouettes -->
  <!-- Left crowd -->
  <ellipse cx="130" cy="295" rx="15" ry="30" fill="#0f0618"/>
  <ellipse cx="155" cy="290" rx="14" ry="28" fill="#100720"/>
  <ellipse cx="178" cy="292" rx="13" ry="26" fill="#0f0618"/>
  <ellipse cx="200" cy="288" rx="14" ry="27" fill="#100720"/>
  <!-- Raised arms left -->
  <line x1="125" y1="270" x2="118" y2="258" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="268" x2="148" y2="256" stroke="#100720" stroke-width="4" stroke-linecap="round"/>
  <line x1="178" y1="270" x2="185" y2="258" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>

  <!-- Right crowd -->
  <ellipse cx="400" cy="291" rx="14" ry="27" fill="#0f0618"/>
  <ellipse cx="422" cy="288" rx="15" ry="29" fill="#100720"/>
  <ellipse cx="446" cy="292" rx="13" ry="26" fill="#0f0618"/>
  <ellipse cx="468" cy="290" rx="14" ry="28" fill="#100720"/>
  <!-- Raised arms right -->
  <line x1="400" y1="268" x2="393" y2="256" stroke="#0f0618" stroke-width="4" stroke-linecap="round"/>
  <line x1="422" y1="265" x2="429" y2="253" stroke="#100720" stroke-width="4" stroke-linecap="round"/>
  <line x1="468" y1="268" x2="475" y2="256" stroke="#100720" stroke-width="4" stroke-linecap="round"/>

  <!-- Musical notes floating -->
  <text x="510" y="100" font-size="22" fill="#fde68a" opacity="0.7" font-family="serif">♪</text>
  <text x="555" y="140" font-size="16" fill="#f9a8d4" opacity="0.6" font-family="serif">♫</text>
  <text x="50" y="120" font-size="18" fill="#fde68a" opacity="0.6" font-family="serif">♩</text>
  <text x="30" y="160" font-size="14" fill="#f9a8d4" opacity="0.5" font-family="serif">♪</text>
  <text x="540" y="80" font-size="13" fill="#fde68a" opacity="0.5" font-family="serif">♬</text>
</svg>
